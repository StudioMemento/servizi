<!doctype html><html lang="en"><meta charset="utf-8"><title>Servizi VFX — verification</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:13px system-ui}header{padding:10px;position:sticky;top:0;background:#161616;z-index:10}button{margin:3px;padding:7px 12px;color:#eee;border:1px solid #444;background:#242424;cursor:pointer}iframe{display:block;margin:12px auto;border:0;background:#0b0c0d;max-width:none}pre{white-space:pre-wrap;max-height:160px;overflow:auto;margin:8px}#wrap{overflow:auto}strong{color:#ffac7d}</style>
<header><strong>Servizi · VFX review</strong> <span id="dimensions"></span><br>
<button data-width="1440">1440</button><button data-width="1024">1024</button><button data-width="768">768</button><button data-width="390">390</button><button data-width="360">360</button>
<button id="top">Top</button><button id="grid">Grid / gutter</button><button id="type">Display type</button><button id="end">Last CTA</button><button id="fx">FX on/off</button>
<button data-frame="0">01 black</button><button data-frame=".12">02 trail</button><button data-frame=".30">03 wire</button><button data-frame=".55">04 reveal</button><button data-frame=".82">05 settling</button><button data-frame="1">06 ready</button>
<button id="layouts">Check layouts</button><button id="perf">Compare 15s off/on</button><button id="lifecycle">Check lifecycle</button><button id="report">Stats</button>
<pre id="status">Ready</pre></header><div id="wrap"><iframe id="view" title="Servizi VFX preview" src="/?fx-review=1&fx-debug=1" width="1024" height="900"></iframe></div>
<script type="module">
const f=document.querySelector('#view'),out=document.querySelector('#status'),label=document.querySelector('#dimensions');let width=1024,enabled=true;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const app=()=>f.contentWindow,doc=()=>f.contentDocument,write=x=>out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
const setWidth=n=>{width=n;f.width=n;f.height=n<600?844:900;label.textContent=n+' × '+f.height+' · DPR '+devicePixelRatio;};setWidth(width);
const point=(x,y,type='mouse',action='pointermove')=>app().dispatchEvent(new PointerEvent(action,{clientX:x,clientY:y,pointerType:type,pointerId:1,isPrimary:true,bubbles:true,cancelable:true}));
const toGrid=()=>{app().MementoVFX.review(null);const h=doc().querySelector('.catalogue-heading');app().scrollTo(0,h.getBoundingClientRect().top+app().scrollY-150);const cards=doc().querySelectorAll('.service-card'),a=cards[0].getBoundingClientRect(),b=cards[1].getBoundingClientRect();point((a.right+b.left)/2,a.bottom-12);};
for(const b of document.querySelectorAll('[data-width]'))b.onclick=()=>{setWidth(+b.dataset.width);};
document.querySelector('#top').onclick=()=>{app().MementoVFX.review(null);app().scrollTo(0,0);};
document.querySelector('#grid').onclick=toGrid;
document.querySelector('#type').onclick=()=>{app().MementoVFX.review(null);const e=doc().querySelector('#heading-web');app().scrollTo(0,e.getBoundingClientRect().top+app().scrollY-250);const r=e.getBoundingClientRect();point(r.left+r.width*.45,r.top+r.height*.65);};
document.querySelector('#end').onclick=()=>{app().MementoVFX.review(null);app().scrollTo(0,doc().documentElement.scrollHeight);};
document.querySelector('#fx').onclick=()=>{enabled=!enabled;app().MementoVFX.setEnabled(enabled);write({enabled});};
for(const b of document.querySelectorAll('[data-frame]'))b.onclick=()=>{app().scrollTo(0,0);app().MementoVFX.review(+b.dataset.frame);write('Load '+b.textContent);};
document.querySelector('#report').onclick=()=>write(app().MementoVFX.stats());
document.querySelector('#layouts').onclick=async()=>{const results=[];for(const w of [1440,1024,768,390,360]){setWidth(w);await sleep(350);toGrid();await sleep(350);const cards=[...doc().querySelectorAll('.service-card')];results.push({width:w,overflow:doc().documentElement.scrollWidth>w,gridColumns:getComputedStyle(doc().querySelector('.service-grid')).gridTemplateColumns.split(' ').length,cards:cards.length,engine:app().MementoVFX.stats().enabled,canvas:doc().querySelectorAll('.memento-fx').length});write(results);} };
document.querySelector('#lifecycle').onclick=async()=>{const result={};app().MementoVFX.review(null);toGrid();point(100,400,'touch','pointerdown');point(100,400,'touch','pointercancel');await sleep(700);result.touchRelease=app().MementoVFX.stats().state;const before=app().MementoVFX.stats().frames;await sleep(400);result.idleFrames=app().MementoVFX.stats().frames-before;app().MementoVFX.destroy();result.afterDestroy={canvas:doc().querySelectorAll('.memento-fx').length,masks:doc().querySelectorAll('.fx-masked').length};write(result);f.src='/?fx-review=1&fx-debug=1&restart=1';};
const quant=a=>{a.sort((a,b)=>a-b);return {median:a[Math.floor(a.length*.5)],p95:a[Math.floor(a.length*.95)]}};
document.querySelector('#perf').onclick=async()=>{setWidth(1440);await sleep(400);toGrid();const result=[];for(const on of [false,true]){app().MementoVFX.setEnabled(on);await sleep(500);let samples=[],last=performance.now(),start=last;await new Promise(resolve=>{const tick=now=>{samples.push(now-last);last=now;const t=now-start;point(400+250*Math.sin(t/700),400+90*Math.cos(t/1000));if(t<15000)requestAnimationFrame(tick);else resolve();};requestAnimationFrame(tick);});result.push({on,frames:quant(samples.slice(2)),engine:app().MementoVFX.stats(),browser:navigator.userAgent,dpr:devicePixelRatio});write(result);} };
</script></html>
